# Shift definitions — replaces definitions.md
#
# span_hours: wall-clock duration from start to end (includes the unpaid break).
#             Use this for physical-presence calculations: rest-period gaps
#             (H#c1f6e3f5), overlap/double-booking checks (H#e91c63ab), and
#             anywhere you need "when is this person physically at work."
#
# paid_hours: span_hours minus the unpaid break. Use this for every hours-based
#             constraint tied to contracted/FTE accounting: the 76h absolute cap
#             (H#f0c5b2c4), the 24h overtime cap (H#e8f7d6c5), the contracted-hours
#             floor (H#d9a8b7c6), and the hour totals/weekend %/night % breakdowns
#             in result.staff.md. Do NOT use span_hours for any of these — it would
#             overcount every shift by the unpaid break length.
#
# crosses_midnight: explicit flag so code never has to infer this by comparing
#             start/end times. True for any shift whose end time is numerically
#             earlier than its start time.
#
# unpaid_break_minutes: length of the unpaid break embedded within span_hours.
#             Not tied to a specific clock time within the shift — only the
#             total duration and paid/unpaid split matter for accounting.

