# Constraint toggles for debugging during development.
#
# Only listed IDs are active. If this file doesn't exist or the
# `constraints` section is absent, ALL constraints are enabled (normal operation).
#
# Every constraint added to constraints.py MUST have a corresponding toggle here.
# See AGENTS.md §10 and README.md "Constraint Toggles" for details.

constraints:
  hard:
    enabled:
      # - "[H#4d9f81c2]"  # Roster positions must be filled
      # - "[H#5e6ad8f4]"  # Skill level matching (threshold)
      # - "[H#84a1d5c9]"  # Skill level hierarchy (merged into SkillLevelRequirement)
      # - "[H#e91c63ab]"  # No overlap (wall-clock)
      # - "[H#30479c74]"  # Graduate shift restriction
      # - "[H#c1f6e3f5]"  # 11-hour rest between shifts
      # - "[H#f4c9b6c8]"  # Day off between night<->day transitions
      # - "[H#a5d0c7d9]"  # No rostering on red-request dates
      # - "[H#b6e1d8e0]"  # No rostering on holidays
      # - "[H#f0c5b2c4]"  # 76h absolute paid-hour cap per block
      # - "[H#e8f7d6c5]"  # 12h overtime cap above raw contracted
  soft:
    enabled:
      # - "[S#d9a8b7c6]"  # Soft contracted-hours floor (reclassified from hard)
      # - "[S#e9b4a1b3]"  # Even overtime distribution
      # - "[S#d2a7f4a6]"  # Night shift fairness (weekday nights only)
      # - "[S#s1a2t3u4]"  # Saturday hours fairness
      # - "[S#s2u3n4d5]"  # Sunday hours fairness
      # - "[S#30c6f5ad]"  # Consecutive same-shift run length penalty (tiered)
      # - "[S#6c1e9a4d]"  # Day/night category run-count penalty
      # - "[S#7b4e19fc]"  # Skill level tiebreaker (minimize over-qualification)
      # - "[S#e7f3a2b1]"  # Unfilled position desirability tiering (implemented in solver coverage constraint)
      # - "[S#f1a2b3c4]"  # Unfilled penalty tier: Sunday, General
      # - "[S#a2b3c4d5]"  # Unfilled penalty tier: Saturday, General
      # - "[S#b3c4d5e6]"  # Unfilled penalty tier: weekday day, General
      # - "[S#c4d5e6f7]"  # Unfilled penalty tier: weekday night, General
