# Constraint toggles for debugging during development.
#
# Only listed IDs are active. If this file doesn't exist or the
# `constraints` section is absent, ALL constraints are enabled (normal operation).
#
# Every constraint added to constraints.py MUST have a corresponding toggle here.
# See AGENTS.md §10 and README.md "Constraint Toggles" for details.

constraints:
  hard:
    enabled: []
  soft:
    enabled:
      - "[S#e9b4a1b3]"  # Even overtime distribution
      - "[S#d2a7f4a6]"  # Equal night shift distribution
      - "[S#30c6f5ad]"  # Consecutive same-shift run penalty
      - "[S#6c1e9a4d]"  # Day/night run count penalty
      - "[S#7b4e19fc]"  # Skill level tiebreaker
