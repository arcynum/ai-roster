# Soft constraint weights — relative ordering signals for the objective
# function, not literal cost units. A weight of 100 means "prioritise
# avoiding this over one weighted 50," not "twice as bad" in any absolute
# sense. Don't build logic elsewhere that assumes proportionality between
# weights. See soft_constraints.md for what each ID refers to, and
# AGENTS.md's file map for the full explanation.

"[S#d9a8b7c6]": 1000  # soft contracted-hours floor — reclassified from hard constraint; minimizes shortfall fairly across staff. Above fairness weights (50-500)
"[S#d2a7f4a6]": 50   # night shift fairness (weekday nights only, per §1.3a)
"[S#s1a2t3u4]": 50   # Saturday hours fairness (replaces blended WeekendFairness)
"[S#s2u3n4d5]": 50   # Sunday hours fairness (replaces blended WeekendFairness)
"[S#e9b4a1b3]": 20   # overtime distributed fairly
"[S#30c6f5ad]": 500  # consecutive-same-shift run length; base unit W for the tiered penalty defined in soft_constraints.md (0 at run=2, 0.1*W at run=1/3, 1*W at run=4, (run-3)*W beyond that) — not a flat weight, see the constraint text
"[S#7b4e19fc]": 5    # low-priority tiebreaker: minimise assigning above-minimum skill level
"[S#6c1e9a4d]": 300  # day/night category run-count fatigue penalty; only fires beyond 2 runs per category per block. Set below S#30c6f5ad's base (500) but above the fairness constraints (50) — a real fatigue concern, but this system has no clinical basis to weight it higher than the same-shift-type run preference; treat as an initial estimate to recalibrate once real rosters are reviewed

