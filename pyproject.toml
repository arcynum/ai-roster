[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-roster"
version = "0.1.0"
description = "Fortnightly roster builder for the pediatric emergency ward at TPCH"
requires-python = ">=3.12"
dependencies = [
    "ortools",
    "PyYAML",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F841"]  # E501: line length; F841: unused variables (pre-existing throughout codebase)

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
